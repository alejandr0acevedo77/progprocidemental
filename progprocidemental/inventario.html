<form action="guardar_producto.php" method="POST">
    <label>Código:</label>
    <input type="text" name="Codigo_Producto" required>

    <label>Nombre del Producto:</label>
    <input type="text" name="Nombre_Producto" required>

    <label>Cantidad:</label>
    <input type="number" name="Cantidad_Producto">

    <label>Descripción:</label>
    <textarea name="Descripcion_Producto"></textarea>

    <label>Marca:</label>
    <input type="text" name="Marca_Producto">

    <label>Precio Unitario:</label>
    <input type="number" step="0.01" name="Valor_Unitario">

    <label>Categoría:</label>
    <select name="Categoria_Productos">
        <option value="electronica">Electrónica</option>
        <option value="perifericos">Periféricos</option>
        <option value="monitores">Monitores</option>
    </select>

    <label>Ubicación en Bodega:</label>
    <input type="text" name="Ubicacion_producto">

    <button type="submit">Guardar Producto</button>
</form>
